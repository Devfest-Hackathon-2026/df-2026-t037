<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ログイン</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D0607A}a:hover{color:#A0405A}
@keyframes wobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes shadow{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.08)}}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}75%{transform:translateY(-6px)}}
@media (prefers-reduced-motion: no-preference){
.wobble{animation:wobble 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.shadow{animation:shadow 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 4s linear infinite;transform-box:fill-box;transform-origin:center}
.twinkle{animation:twinkle 1.6s ease-in-out infinite}
.hop{animation:hop 2.4s ease-in-out infinite}
}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 28px 22px 22px; background: linear-gradient(180deg, #FFF4F6 0%, #FDF8F4 55%, #FFF8E8 100%); font-family: 'M PLUS Rounded 1c', sans-serif; color: #4A3E3A; display: flex; flex-direction: column; align-items: center; gap: 14px">
<div style="margin-top: 36px; width: 230px; height: 230px; border-radius: 115px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="210" height="210" viewBox="0 0 160 160" role="img" aria-label="たまご。中で何かが育っている、点の目のたまご">
<defs><radialGradient id="lg1" cx="38%" cy="28%" r="80%"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset=".6" stop-color="#FFF1DE"></stop><stop offset="1" stop-color="#E8C8A0"></stop></radialGradient></defs>
<path class="twinkle" d="M24 40 L26 46 L32 48 L26 50 L24 56 L22 50 L16 48 L22 46 Z" fill="#F5C842"></path>
<path class="twinkle" style="animation-delay: .8s" d="M136 30 L137.5 34 L141.5 35.5 L137.5 37 L136 41 L134.5 37 L130.5 35.5 L134.5 34 Z" fill="#F2A6B8"></path>
<ellipse class="shadow" cx="80" cy="148" rx="34" ry="5.5" fill="#6A4A2A" opacity=".14"></ellipse>
<g class="wobble">
<path d="M80 20 C112 20 128 70 128 102 C128 130 106 146 80 146 C54 146 32 130 32 102 C32 70 48 20 80 20 Z" fill="url(#lg1)"></path>
<circle cx="58" cy="66" r="7" fill="#9CC4EE" opacity=".55"></circle><circle cx="104" cy="58" r="5" fill="#F2A6B8" opacity=".6"></circle><circle cx="110" cy="118" r="6" fill="#A8DA8C" opacity=".55"></circle><circle cx="48" cy="124" r="4.5" fill="#F5C842" opacity=".6"></circle>
<path d="M50 84 L60 76 L68 86 L78 74 L88 86 L98 76 L110 84" fill="none" stroke="#D8B48A" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"></path>
<ellipse cx="62" cy="44" rx="11" ry="7" fill="#FFFFFF" opacity=".8"></ellipse>
<g class="blink"><ellipse cx="68" cy="104" rx="4.2" ry="6" fill="#2B2632"></ellipse><ellipse cx="92" cy="104" rx="4.2" ry="6" fill="#2B2632"></ellipse></g>
<circle cx="66.6" cy="101.6" r="1.6" fill="#FFFFFF"></circle><circle cx="90.6" cy="101.6" r="1.6" fill="#FFFFFF"></circle>
<ellipse cx="58" cy="116" rx="6.5" ry="3.8" fill="#FF8FA3" opacity=".5"></ellipse><ellipse cx="102" cy="116" rx="6.5" ry="3.8" fill="#FF8FA3" opacity=".5"></ellipse>
<path d="M76 114 Q80 118 84 114" fill="none" stroke="#2B2632" stroke-width="2" stroke-linecap="round"></path>
</g>
</svg>
</div>
<div style="display: flex; gap: 6px">
<sc-for list="{{minis}}" as="m" hint-placeholder-count="9"><span class="hop" style="animation-delay: {{m.dl}}; width: 26px; height: 26px; border-radius: 13px; background: {{m.g}}; display: flex; align-items: center; justify-content: center; gap: 5px; padding-top: 3px; box-sizing: border-box"><span style="width: 3px; height: 4.5px; border-radius: 2px; background: {{m.ec}}"></span><span style="width: 3px; height: 4.5px; border-radius: 2px; background: {{m.ec}}"></span></span></sc-for>
</div>
<div style="text-align: center">
<h1 style="margin: 6px 0 0; font-size: 28px; font-weight: 900">進路たまごっち<span style="font-size: 16px">（仮）</span></h1>
<p style="margin: 6px 0 0; font-size: 14px; line-height: 1.7; color: #6B5E58">勉強するほど、志望校のキャラが育つ。<br>受験の日まで、いっしょにがんばろう。</p>
</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap; justify-content: center">
<span style="font-size: 11px; font-weight: 800; background: #FFFFFF; padding: 4px 10px; border-radius: 10px">志望校でキャラが決まる</span>
<span style="font-size: 11px; font-weight: 800; background: #FFFFFF; padding: 4px 10px; border-radius: 10px">受験日から逆算</span>
<span style="font-size: 11px; font-weight: 800; background: #FFFFFF; padding: 4px 10px; border-radius: 10px">毎日ひとことアドバイス</span>
</div>
<div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 10px">
<a href="Setup.dc.html" style="height: 54px; border-radius: 27px; background: #FFFFFF; border: 1.5px solid #E2D8CE; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; color: #3A3530; font-size: 16px; font-weight: 900"><span style="width: 26px; height: 26px; border-radius: 13px; background: #F4F4F6; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; color: #4285F4">G</span>Googleでログイン</a>
<a href="Setup.dc.html" style="height: 46px; border-radius: 23px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #D0607A; font-size: 14px; font-weight: 900">ゲストではじめる</a>
<p style="margin: -4px 0 0; font-size: 11px; color: #8A7A72; text-align: center; line-height: 1.6">ゲストの記録は、あとからGoogleアカウントに引き継げます<br>記録は本人だけが見られます｜<a href="#" style="color: #8A7A72">利用規約</a>・<a href="#" style="color: #8A7A72">プライバシー</a></p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const d = [['#E6F1FC', '#9CC4EE', '#5F8FC8'], ['#FFF6E6', '#F6C88E', '#D08A4E'], ['#EEFAE4', '#A8DA8C', '#5E9E4C'], ['#8EA4DA', '#3E5698', '#1E2D5E'], ['#FAF9FF', '#CFCBE6', '#8E88BA'], ['#EEFCF5', '#8EDDB8', '#3FA47A'], ['#FBE2E7', '#D27A8C', '#9A2A40'], ['#F8F0FB', '#C9A6DC', '#7E4E9E'], ['#FFFAE6', '#F8DC86', '#D8A838']];
return { minis: d.map(([a, b, c], i) => ({ g: 'radial-gradient(circle at 38% 30%, ' + a + ' 0%, ' + b + ' 55%, ' + c + ' 100%)', ec: i === 3 ? '#FFFFFF' : '#2B2632', dl: (i * 0.15).toFixed(2) + 's' })) };
}
}
</script>
</body>
</html>
